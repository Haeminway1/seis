<!doctype html>
<!-- 시험지 — 지문과 문항을 그대로 낸다. 빈칸 마커는 밑줄로 비워서 출력한다. -->
<meta charset="utf-8"><title>{{title}}</title>
<style>{{base_css}}</style>
<style>
  /* 시험지만의 조정: 지문을 조금 크게, 문항 간격을 넉넉히 */
  :root { --passage-size: 11pt; }
  .item { margin-bottom: 20px; }
</style>
<body><div class="sheet">
  <header class="head">
    <div><div class="kind">{{kind}}</div><h1>{{title}}</h1></div>
    <div class="meta">{{meta}}</div>
  </header>
  {{content}}
  <footer class="foot"><span>{{footer_left}}</span><span>{{footer_right}}</span></footer>
</div></body>

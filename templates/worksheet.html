<!doctype html>
<!-- 숙제·연습문제 — 이름/날짜 칸이 있고, 서술형에는 답 쓸 자리를 준다. -->
<meta charset="utf-8"><title>{{title}}</title>
<style>{{base_css}}</style>
<style>
  :root { --accent: #0f766e; }          /* 숙제는 색을 달리해 시험지와 섞이지 않게 한다 */
  .item { margin-bottom: 22px; }
  .choices li { padding: 2.5px 0; }     /* 손으로 표시할 여유 */
</style>
<body><div class="sheet">
  <header class="head">
    <div><div class="kind">{{kind}}</div><h1>{{title}}</h1></div>
    <div class="meta">{{meta}}</div>
  </header>
  <div class="namebar"><span>이름</span><span>날짜</span><span>점수</span></div>
  {{content}}
  <footer class="foot"><span>{{footer_left}}</span><span>{{footer_right}}</span></footer>
</div></body>
